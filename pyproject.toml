[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerloop"
version = "0.1.0"
description = "The runtime for AI agents that move money - exactly-once effects, a hash-chained audit ledger, and human approval gates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shivam Sharma", email = "sk8612181@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
]
anthropic = [
    "anthropic>=1.0,<2.0",
]
all = [
    "ledgerloop[anthropic]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerloop"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ledgerloop"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=ledgerloop --cov-report=term-missing"
